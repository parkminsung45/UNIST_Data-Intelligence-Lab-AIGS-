name: Sync Notion TIL

on:
  schedule:
    # 00:00 UTC = 09:00 KST, daily
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: code
        run: npm install

      - name: Sync from Notion
        working-directory: code
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: "3abb3408-c4c5-80c4-a463-d6bf0cff0c77"
        run: npm run sync

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add TIL/ code/.notion-sync-manifest.json
          git diff --cached --quiet || git commit -m "chore: sync TIL from Notion"
          git push
