name: Debug Notion Blocks

on:
  workflow_dispatch:
    inputs:
      page_ids:
        description: "Comma-separated Notion page IDs"
        required: true

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node scripts/debug-blocks.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DEBUG_PAGE_IDS: ${{ inputs.page_ids }}
